<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quantum Reel</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%E2%9A%A1%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand"><span class="mark">⚡</span>Quantum Reel</div>
    <span class="tagline">One photo → quantum transitions → a beat-synced reel</span>
    <span class="powered">engines by Moth</span>
  </header>

  <main class="app">
    <section class="stage">
      <div class="phone">
        <div class="screen" id="screen">
          <canvas id="view" width="720" height="1280"></canvas>
          <button class="empty" id="empty" type="button">
            <span class="glyph">⚛</span>
            <b>Drop a photo</b>
            <span>or tap to choose one</span>
          </button>
          <span class="badge" id="badge" hidden></span>
          <span class="hint" id="hint" hidden>Press ⚡ Generate</span>
        </div>
        <span class="island"></span>
      </div>

      <div class="transport">
        <button id="play" class="icon" type="button" title="Play / pause (space)" disabled>❚❚</button>
        <button id="mute" class="icon" type="button" title="Mute preview">🔊</button>
        <span class="time" id="time">0:00 / 0:00</span>
        <button id="download" class="out" type="button" disabled>⬇ Download MP4</button>
        <button id="saveFrame" class="out" type="button" disabled>Save Final Frame</button>
      </div>
    </section>

    <aside class="dock">
      <div class="card">
        <h2><span class="num">1</span>Upload &amp; frame</h2>
        <label class="drop" id="drop">
          <input id="file" type="file" accept="image/*">
          <img id="thumb" alt="" hidden>
          <span id="dropText">Drop a photo here or <u>browse</u></span>
        </label>
        <div class="row">
          <div class="seg" id="format" role="radiogroup" aria-label="Format">
            <button type="button" data-v="reel">9:16 Reel</button>
            <button type="button" data-v="square">1:1 Square</button>
          </div>
          <div class="seg" id="fit" role="radiogroup" aria-label="Fit">
            <button type="button" data-v="crop">Crop</button>
            <button type="button" data-v="letterbox">Letterbox</button>
          </div>
        </div>
      </div>

      <div class="card">
        <h2><span class="num">2</span>Style &amp; engine</h2>
        <label class="field"><span>Quantum engine</span><select id="engine"></select></label>
        <label class="drop slim" id="targetDrop" hidden>
          <input id="targetFile" type="file" accept="image/*">
          <img id="targetThumb" alt="" hidden>
          <span id="targetText">Morph target: a quantum interference pattern. Drop an image to use your own.</span>
        </label>
        <div class="presets" id="presets" role="radiogroup" aria-label="Transition preset"></div>
        <label class="field"><span>Soundtrack</span><select id="track"></select></label>
      </div>

      <div class="card go">
        <h2><span class="num">3</span>Generate &amp; export</h2>
        <button id="generate" class="cta" type="button" disabled>⚡ Generate Quantum Reel</button>
        <div class="progress" id="progress" hidden>
          <div class="bar"><i id="bar"></i></div>
          <div class="msg"><span id="msg"></span><span id="elapsed"></span></div>
          <div class="dots" id="dots"></div>
        </div>
      </div>
    </aside>
  </main>

  <script src="app.js"></script>
</body>
</html>
